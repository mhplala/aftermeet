name: AfterMeet
options:
  bundleIdPrefix: app.siku
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.9"
    CURRENT_PROJECT_VERSION: "49"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "9E96E6F329CAC93BD47EBD01100ABD51C32A4D1B"
    DEVELOPMENT_TEAM: UK68KKX58X
targets:
  AfterMeet:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.siku.aftermeet
        PRODUCT_NAME: AfterMeet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aftermeet
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 会中转写需要录制你的发言（音频仅在本机处理）。
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "把会中音频本地转写成文字"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: Aftermeet.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Bundle whisper-server
        script: |
          if [ -f "${SRCROOT}/Vendor/whisper/whisper-server" ]; then
            cp -f "${SRCROOT}/Vendor/whisper/whisper-server" "${CODESIGNING_FOLDER_PATH}/Contents/MacOS/whisper-server"
            chmod +x "${CODESIGNING_FOLDER_PATH}/Contents/MacOS/whisper-server"
          fi
    scheme:
      testTargets:
        - AfterMeetTests
      gatherCoverageData: true
      coverageTargets:
        - AfterMeet

  AfterMeetTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: AfterMeet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.siku.aftermeet.tests
        GENERATE_INFOPLIST_FILE: YES
